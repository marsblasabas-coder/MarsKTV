<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mars KTV Room</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background-color: #080d19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header Layout */
    .navbar {
      height: 60px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #080d19;
      border-bottom: 1px solid #1a233a;
      position: relative;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
    }

    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .sub-brand {
      color: #64748b;
      font-size: 0.65rem;
      letter-spacing: 1px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: -2px;
    }

    /* Dark Outlined Queue Badge Pill - Pure White Text Label */
    .queue-badge-pill {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0c162d;
      border: 1px solid #d97706;
      border-radius: 9999px;
      padding: 6px 22px;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(217, 119, 6, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .queue-badge-pill #queue-count-display {
      color: #facc15;
      font-size: 1.1rem;
      font-weight: 900;
      text-shadow: 0 0 6px rgba(250, 204, 21, 0.6);
    }

    /* Right Side White Clock */
    .date-time-text {
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Main Grid & Panels */
    .main-container { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; flex: 1; height: calc(100vh - 60px); }
    .player-section { display: flex; flex-direction: column; gap: 10px; height: 100%; }
    .video-wrapper { position: relative; flex: 1; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
    #player { width: 100%; height: 100%; }

    .now-playing-bar { background: #0f1a30; border: 1px solid #1e293b; border-radius: 10px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .np-tag { color: #ec4899; font-weight: 800; font-size: 0.8rem; margin-right: 8px; }

    .sidebar-section { display: flex; flex-direction: column; gap: 10px; height: 100%; }
    .queue-card { flex: 1; background: #0f1a30; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; overflow-y: auto; }
    .card-title { color: #ec4899; font-size: 0.75rem; font-weight: 800; margin-bottom: 12px; }
    .empty-queue { color: #64748b; font-size: 0.85rem; }
    .queue-item { background: #16233d; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; color: #cbd5e1; }

    .singers-card { background: #0f1a30; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; }
    .singer-item { background: #16233d; padding: 8px 12px; border-radius: 20px; font-size: 0.8rem; color: #94a3b8; }

    .qr-card { background: #0f1a30; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; }
    #qrcode { background: #fff; padding: 6px; border-radius: 8px; }
    .qr-info { display: flex; flex-direction: column; gap: 4px; }
    .room-code { font-size: 1.1rem; font-weight: 800; color: #fff; }

    .toast-overlay { position: absolute; top: 20px; right: 20px; background: rgba(236, 72, 153, 0.9); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 1.2rem; display: none; z-index: 100; }
  </style>
</head>
<body>

  <div id="reactionToast" class="toast-overlay"></div>

  <!-- Header Bar -->
  <div class="navbar">
    <div class="brand-container">
      <div class="brand">Mars KTV Room</div>
      <div class="sub-brand">KARAOKE TOGETHER</div>
    </div>

    <div class="queue-badge-pill">
      TOTAL IN QUEUE: <span id="queue-count-display">0</span>
    </div>

    <div id="liveClock" class="date-time-text">--:--:--</div>
  </div>

  <!-- Main Body Content -->
  <div class="main-container">
    <div class="player-section">
      <div class="video-wrapper">
        <div id="player"></div>
      </div>
      <div class="now-playing-bar">
        <div>
          <span class="np-tag">♪ NOW PLAYING</span>
          <span id="npTitle" class="np-title">No song playing</span>
        </div>
        <div style="color:#64748b; font-size:0.8rem;">Added by <span id="npUser">Guest</span></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="queue-card">
        <div class="card-title">▷ UP NEXT</div>
        <div id="queueList" class="empty-queue">No songs queued yet</div>
      </div>

      <div class="singers-card">
        <div id="singerActivity" class="singer-item">♪ Now singing: Guest</div>
      </div>

      <div class="qr-card">
        <div id="qrcode"></div>
        <div class="qr-info">
          <div style="font-size:0.8rem; color:#94a3b8;">Scan to Join</div>
          <div style="font-size:0.65rem; color:#ec4899; font-weight:800;">ROOM CODE</div>
          <div id="roomDisplay" class="room-code">------</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const socket = io();
    let player;
    let isPlayerReady = false;
    let currentVideoId = null;

    // Clock Execution Logic - Custom Format: "Thur, August 6, 2026 | 10:24:32 AM"
    function startLiveClock() {
      const clockEl = document.getElementById('liveClock');
      function update() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', { 
          weekday: 'short', 
          month: 'long', 
          day: 'numeric', 
          year: 'numeric' 
        });
        const timeStr = now.toLocaleTimeString('en-US', { 
          hour: '2-digit', 
          minute: '2-digit', 
          second: '2-digit', 
          hour12: true 
        });

        clockEl.textContent = `${dateStr}  |  ${timeStr}`;
      }
      update();
      setInterval(update, 1000);
    }
    document.addEventListener('DOMContentLoaded', startLiveClock);

    // Room ID Setup
    const roomCode = 'ROOM-' + Math.floor(1000 + Math.random() * 9000);
    document.getElementById("roomDisplay").textContent = roomCode;
    socket.emit('joinRoom', roomCode);

    // QR Code Generator
    const mobileUrl = `${window.location.protocol}//${window.location.host}/remote.html?room=${roomCode}`;
    new QRCode(document.getElementById("qrcode"), { text: mobileUrl, width: 70, height: 70 });

    // YouTube Player Initialization
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: { 
          'autoplay': 1, 
          'controls': 1,
          'enablejsapi': 1,
          'origin': window.location.origin 
        },
        events: {
          'onReady': (event) => { 
            isPlayerReady = true; 
            if (window.pendingSongId) {
              player.loadVideoById(window.pendingSongId);
              window.pendingSongId = null;
            }
          },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.ENDED) {
              currentVideoId = null;
              socket.emit('nextSong');
            }
          }
        }
      });
    }

    // Reaction Sounds Event
    socket.on('triggerSound', (sound) => {
      const toast = document.getElementById('reactionToast');
      toast.textContent = sound === 'applause' ? "👏 APPLAUSE!" : sound === 'airhorn' ? "📢 AIRHORN!" : "🎉 CHEER!";
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    });

    // Remote Volume Sync
    socket.on('updateVolume', (vol) => {
      if (player && player.setVolume) player.setVolume(vol);
    });

    // Queue Listener & Handler
    socket.on('updateQueue', (queue) => {
      const queueList = document.getElementById('queueList');
      const npTitle = document.getElementById('npTitle');
      const npUser = document.getElementById('npUser');
      const singerActivity = document.getElementById('singerActivity');
      const countEl = document.getElementById('queue-count-display');

      if (countEl) {
        countEl.textContent = queue ? queue.length : 0;
      }

      queueList.innerHTML = '';

      if (!queue || queue.length === 0) {
        npTitle.textContent = "No song playing";
        npUser.textContent = "Guest";
        singerActivity.textContent = "♪ Now singing: Guest";
        queueList.className = "empty-queue";
        queueList.textContent = "No songs queued yet";
        currentVideoId = null;
        if (isPlayerReady && player.stopVideo) {
          player.stopVideo();
        }
        return;
      }

      // Update Currently Playing Info UI
      const currentSong = queue[0];
      npTitle.textContent = currentSong.title;
      npUser.textContent = currentSong.user || 'Guest';
      singerActivity.textContent = `♪ Now singing: ${currentSong.user || 'Guest'}`;

      // Autoplay Next Song Fix
      if (currentSong.id !== currentVideoId) {
        currentVideoId = currentSong.id;
        if (isPlayerReady) {
          player.loadVideoById(currentSong.id);
        } else {
          window.pendingSongId = currentSong.id;
        }
      }

      // Render Upcoming List
      const upcoming = queue.slice(1);
      if (upcoming.length === 0) {
        queueList.className = "empty-queue";
        queueList.textContent = "No songs queued yet";
      } else {
        queueList.className = "";
        upcoming.forEach((song) => {
          const item = document.createElement('div');
          item.className = 'queue-item';
          item.textContent = `${song.title} (${song.user})`;
          queueList.appendChild(item);
        });
      }
    });
  </script>
</body>
</html>
