<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SingRoom KTV</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background-color: #080d19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .navbar { 
      height: 50px; 
      padding: 0 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background-color: #0b1329; 
      border-bottom: 1px solid #16213e; 
    }
    .brand { font-weight: 800; font-size: 1.1rem; color: #fff; }
    .brand span { color: #ec4899; font-size: 0.7rem; display: block; letter-spacing: 1px; font-weight: 600; }
    
    .header-info-box { display: flex; align-items: center; gap: 12px; }
    .date-time-text { color: #ffcc00; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.5px; }
    .queue-box { background-color: #ffcc00; color: #080d19; font-weight: 800; font-size: 0.95rem; padding: 2px 10px; border-radius: 6px; min-width: 20px; text-align: center; box-shadow: 0 0 8px rgba(255, 204, 0, 0.4); }

    .main-container { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr auto; gap: 12px; padding: 12px; flex: 1; height: calc(100vh - 50px); }
    .player-section { display: flex; flex-direction: column; gap: 10px; height: 100%; }
    .video-wrapper { position: relative; flex: 1; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
    #player { width: 100%; height: 100%; }
    .now-playing-bar { background: #0f1a30; border: 1px solid #1e293b; border-radius: 10px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .np-tag { color: #ec4899; font-weight: 800; font-size: 0.8rem; margin-right: 8px; }
    .sidebar-section { display: flex; flex-direction: column; gap: 10px; height: 100%; }
    .queue-card { flex: 1; background: #0f1a30; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; overflow-y: auto; }
    .card-title { color: #ec4899; font-size: 0.75rem; font-weight: 800; margin-bottom: 12px; }
    .empty-queue { color: #64748b; font-size: 0.85rem; }
    .queue-item { background: #16233d; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; color: #cbd5e1; }
    .singers-card { background: #0f1a30; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; }
    .singer-item { background: #16233d; padding: 8px 12px; border-radius: 20px; font-size: 0.8rem; color: #94a3b8; }
    .qr-card { background: #0f1a30; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; }
    #qrcode { background: #fff; padding: 6px; border-radius: 8px; }
    .qr-info { display: flex; flex-direction: column; gap: 4px; }
    .room-code { font-size: 1.1rem; font-weight: 800; color: #fff; }
    .toast-overlay { position: absolute; top: 20px; right: 20px; background: rgba(236, 72, 153, 0.9); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 1.2rem; display: none; z-index: 100; }
  </style>
</head>
<body>

  <div id="reactionToast" class="toast-overlay"></div>

  <div class="navbar">
    <div class="brand">SingRoom KTV <span>KARAOKE TOGETHER</span></div>
    <div class="header-info-box">
      <div id="liveDateTime" class="date-time-text">--</div>
      <div id="queueBadge" class="queue-box">0</div>
    </div>
  </div>

  <div class="main-container">
    <div class="player-section">
      <div class="video-wrapper">
        <div id="player"></div>
      </div>
      <div class="now-playing-bar">
        <div>
          <span class="np-tag">♪ NOW PLAYING</span>
          <span id="npTitle" class="np-title">No song playing</span>
        </div>
        <div style="color:#64748b; font-size:0.8rem;">Added by <span id="npUser">Guest</span></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="queue-card">
        <div class="card-title">▷ UP NEXT</div>
        <div id="queueList" class="empty-queue">No songs queued yet</div>
      </div>

      <div class="singers-card">
        <div id="singerActivity" class="singer-item">♪ Now singing: Guest</div>
      </div>

      <div class="qr-card">
        <div id="qrcode"></div>
        <div class="qr-info">
          <div style="font-size:0.8rem; color:#94a3b8;">Scan to Join</div>
          <div style="font-size:0.65rem; color:#ec4899; font-weight:800;">ROOM CODE</div>
          <div id="roomDisplay" class="room-code">------</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const socket = io();
    let player;
    let isPlayerReady = false;

    function updateClock() {
      const now = new Date();
      const optionsDate = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      const optionsTime = { hour: '2-digit', minute: '2-digit', hour12: true };
      document.getElementById('liveDateTime').innerText = `${now.toLocaleDateString('en-US', optionsDate)}  |  ${now.toLocaleTimeString('en-US', optionsTime)}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Standardize Room Code to uppercase
    const roomCode = 'ROOM-' + Math.floor(1000 + Math.random() * 9000);
    document.getElementById("roomDisplay").textContent = roomCode;
    
    socket.emit('joinRoom', roomCode);

    const mobileUrl = `${window.location.protocol}//${window.location.host}/remote.html?room=${roomCode}`;
    new QRCode(document.getElementById("qrcode"), { text: mobileUrl, width: 70, height: 70 });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: { 'autoplay': 1, 'controls': 1 },
        events: {
          'onReady': () => { isPlayerReady = true; },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.ENDED) socket.emit('nextSong');
          }
        }
      });
    }

    socket.on('playerPlay', () => {
      if (isPlayerReady && player && player.playVideo) player.playVideo();
    });

    socket.on('playerPause', () => {
      if (isPlayerReady && player && player.pauseVideo) player.pauseVideo();
    });

    socket.on('triggerSound', (sound) => {
      const toast = document.getElementById('reactionToast');
      toast.textContent = sound === 'applause' ? "👏 APPLAUSE!" : sound === 'airhorn' ? "📢 AIRHORN!" : "🎉 CHEER!";
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    });

    socket.on('updateVolume', (vol) => {
      if (player && player.setVolume) player.setVolume(vol);
    });

    socket.on('updateQueue', (queue) => {
      const queueList = document.getElementById('queueList');
      const npTitle = document.getElementById('npTitle');
      const npUser = document.getElementById('npUser');
      const singerActivity = document.getElementById('singerActivity');
      const queueBadge = document.getElementById('queueBadge');
      
      const totalCount = queue ? queue.length : 0;
      queueBadge.innerText = totalCount;
      queueList.innerHTML = '';

      if (totalCount === 0) {
        npTitle.textContent = "No song playing";
        npUser.textContent = "Guest";
        singerActivity.textContent = "♪ Now singing: Guest";
        queueList.className = "empty-queue";
        queueList.textContent = "No songs queued yet";
        if (isPlayerReady && player && player.stopVideo) player.stopVideo();
        return;
      }

      npTitle.textContent = queue[0].title;
      npUser.textContent = queue[0].user || 'Guest';
      singerActivity.textContent = `♪ Now singing: ${queue[0].user || 'Guest'}`;

      if (isPlayerReady && queue[0]) {
        const currentData = player.getVideoData ? player.getVideoData() : null;
        if (!currentData || currentData.video_id !== queue[0].id) {
          player.loadVideoById(queue[0].id);
        }
      }

      const upcoming = queue.slice(1);
      if (upcoming.length === 0) {
        queueList.className = "empty-queue";
        queueList.textContent = "No songs queued yet";
      } else {
        queueList.className = "";
        upcoming.forEach((song) => {
          const item = document.createElement('div');
          item.className = 'queue-item';
          item.textContent = `${song.title} (${song.user})`;
          queueList.appendChild(item);
        });
      }
    });
  </script>
</body>
</html>
