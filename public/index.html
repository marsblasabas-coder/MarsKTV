<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarsKTV - Main Screen</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0e14;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Top Right Header Bar */
    .top-right-header {
      position: absolute;
      top: 15px;
      right: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }

    .date-time-text {
      color: #ffcc00;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 204, 0, 0.3);
    }

    .queue-badge {
      background-color: #ffcc00;
      color: #0b0e14;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 4px 12px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
    }

    /* Layout Containers */
    .main-container {
      display: flex;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      gap: 20px;
    }

    .player-section {
      flex: 3;
      display: flex;
      flex-direction: column;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-container iframe, 
    .video-container div#player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .sidebar {
      flex: 1;
      background: #131822;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .queue-title {
      color: #ff4081;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .queue-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      max-height: 60vh;
    }

    .queue-item {
      background: #1c2333;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .qr-container {
      background: #1c2333;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .qr-container img {
      width: 120px;
      height: 120px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Top Right Live Bar -->
  <div class="top-right-header">
    <div class="date-time-text" id="live-datetime">Wed, Aug 5, 2026 | 11:29 PM</div>
    <div class="queue-badge" id="queue-count">0</div>
  </div>

  <!-- App Layout -->
  <div class="main-container">
    <div class="player-section">
      <h1 style="margin: 0 0 15px 0; color: #ff4081; font-size: 1.5rem;">MarsKTV</h1>
      <div class="video-container">
        <div id="player"></div>
      </div>
    </div>

    <div class="sidebar">
      <div>
        <div class="queue-title">UP NEXT</div>
        <ul class="queue-list" id="queue-list-display">
          <li class="queue-item" style="color: #888;">No songs in queue</li>
        </ul>
      </div>

      <div class="qr-container">
        <div id="qrcode"></div>
        <p style="margin: 8px 0 0 0; font-size: 0.85rem; color: #ffcc00; font-weight: bold;">Scan to Remote</p>
      </div>
    </div>
  </div>

  <!-- Socket.io Script -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Live Date & Time Counter
    function updateDateTime() {
      const now = new Date();
      const optionsDate = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      const optionsTime = { hour: 'numeric', minute: '2-digit', hour12: true };
      
      const dateStr = now.toLocaleDateString('en-US', optionsDate);
      const timeStr = now.toLocaleTimeString('en-US', optionsTime);
      
      document.getElementById('live-datetime').innerText = `${dateStr} | ${timeStr}`;
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();

    // Socket Queue Listener
    socket.on('queueUpdate', (queue) => {
      const count = queue ? queue.length : 0;
      document.getElementById('queue-count').innerText = count;

      const listContainer = document.getElementById('queue-list-display');
      listContainer.innerHTML = '';

      if (!queue || queue.length === 0) {
        listContainer.innerHTML = '<li class="queue-item" style="color: #888;">No songs in queue</li>';
        return;
      }

      queue.forEach((song, index) => {
        const item = document.createElement('li');
        item.className = 'queue-item';
        item.innerText = `${index + 1}. ${song.title || song}`;
        listContainer.appendChild(item);
      });
    });
  </script>
</body>
</html>
