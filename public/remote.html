<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MarsKTV Remote</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: #0b0e14;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h2 {
      margin: 0 0 16px 0;
      color: #ff4081;
      text-align: center;
      font-size: 1.4rem;
    }

    /* Icon-Only Control Buttons */
    .remote-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .ctrl-btn {
      background-color: #ffcc00;
      color: #0b0e14;
      border: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 204, 0, 0.35);
      transition: transform 0.1s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .ctrl-btn:active {
      transform: scale(0.90);
      background-color: #e6b800;
    }

    .ctrl-btn svg {
      width: 28px;
      height: 28px;
    }

    /* Search Section */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: #131822;
      border: 1px solid #1c2333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #ffcc00;
    }

    .add-btn {
      background: #ff4081;
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:active {
      opacity: 0.8;
    }

    /* Active Feedback Toast */
    .status-msg {
      text-align: center;
      color: #ffcc00;
      font-size: 0.9rem;
      height: 20px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <h2>MarsKTV Remote</h2>

  <!-- Label-Free Media Controls -->
  <div class="remote-controls">
    <button id="btn-pause" class="ctrl-btn" aria-label="Play/Pause">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    </button>
    
    <button id="btn-next" class="ctrl-btn" aria-label="Next Song">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
      </svg>
    </button>
  </div>

  <!-- Song Request Input -->
  <div class="search-box">
    <input type="text" id="song-input" class="search-input" placeholder="Search song or paste YouTube link...">
    <button id="btn-add" class="add-btn">Queue</button>
  </div>

  <div id="status" class="status-msg"></div>

  <!-- Socket.io Script -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusEl = document.getElementById('status');

    function showToast(msg) {
      statusEl.innerText = msg;
      setTimeout(() => { statusEl.innerText = ''; }, 2000);
    }

    // Play/Pause Action
    document.getElementById('btn-pause').addEventListener('click', () => {
      socket.emit('togglePlay');
      showToast('Toggled Play/Pause');
    });

    // Next Song Action
    document.getElementById('btn-next').addEventListener('click', () => {
      socket.emit('nextSong');
      showToast('Skipped to Next Song');
    });

    // Add Song Action
    document.getElementById('btn-add').addEventListener('click', sendSong);
    document.getElementById('song-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendSong();
    });

    function sendSong() {
      const input = document.getElementById('song-input');
      const song = input.value.trim();
      if (song) {
        socket.emit('addSong', song);
        showToast('Song Added to Queue!');
        input.value = '';
      }
    }
  </script>
</body>
</html>
