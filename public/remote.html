<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mars KTV Remote Control</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; padding-bottom: 90px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { font-size: 1.2rem; font-weight: 800; color: #f43f5e; }
    .room-tag { background: #334155; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; color: #38bdf8; }

    .user-input { margin-bottom: 16px; }
    .user-input input { width: 100%; padding: 10px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.9rem; }

    .emoji-section { background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 20px; text-align: center; }
    .emoji-label { font-size: 0.75rem; color: #94a3b8; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
    .emoji-bar { display: flex; justify-content: space-around; }
    .emoji-btn { font-size: 1.6rem; background: #0f172a; border: 1px solid #334155; width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .emoji-btn:active { transform: scale(0.9); }

    .nav-tabs { display: flex; gap: 8px; border-bottom: 1px solid #334155; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #94a3b8; font-weight: 700; font-size: 0.85rem; border-bottom: 2px solid transparent; cursor: pointer; }
    .tab-btn.active { color: #f43f5e; border-bottom-color: #f43f5e; }

    .view-section { display: none; }
    .view-section.active { display: block; }

    .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
    .search-box input { flex: 1; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 1rem; }
    .search-box button { background: #f43f5e; color: #fff; border: none; padding: 0 18px; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .item-card { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
    .item-card img { width: 60px; height: 45px; border-radius: 6px; object-fit: cover; }
    .item-info { flex: 1; overflow: hidden; }
    .item-title { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    .btn-add { background: #10b981; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease; min-width: 75px; }
    .btn-add.added { background: #3b82f6; }
    .btn-danger { background: #ef4444; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }

    .sound-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .sound-btn { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 14px 8px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-align: center; }
    .sound-btn:active { background: #f43f5e; color: #fff; }

    .playback-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #090d16; border-top: 1px solid #334155; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .btn-skip { background: #3b82f6; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; font-size: 0.85rem; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">🎙️ Mars KTV</div>
    <div id="roomDisplay" class="room-tag">ROOM-----</div>
  </div>

  <div class="user-input">
    <input type="text" id="userName" placeholder="Your Name (e.g. Alex)" maxlength="15">
  </div>

  <div class="emoji-section">
    <div class="emoji-label">Send Reaction to TV</div>
    <div class="emoji-bar">
      <button class="emoji-btn" onclick="sendReaction('👏')">👏</button>
      <button class="emoji-btn" onclick="sendReaction('🎉')">🎉</button>
      <button class="emoji-btn" onclick="sendReaction('❤️')">❤️</button>
      <button class="emoji-btn" onclick="sendReaction('🎤')">🎤</button>
      <button class="emoji-btn" onclick="sendReaction('🔥')">🔥</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('search')">Search Songs</button>
    <button class="tab-btn" onclick="switchTab('queue')">Queue (<span id="queueCount">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('fx')">SFX Board</button>
    <button class="tab-btn" onclick="switchTab('ticker')">Marquee</button>
  </div>

  <div id="searchView" class="view-section active">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search song or artist...">
      <button onclick="performSearch()">Search</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <div id="queueView" class="view-section">
    <div id="queueList"></div>
  </div>

  <div id="fxView" class="view-section">
    <div class="sound-grid">
      <button class="sound-btn" onclick="playSound('applause')">👏 Applause</button>
      <button class="sound-btn" onclick="playSound('cheer')">🙌 Cheering</button>
      <button class="sound-btn" onclick="playSound('laughter')">😂 Laugh</button>
      <button class="sound-btn" onclick="playSound('airhorn')">📢 Airhorn</button>
      <button class="sound-btn" onclick="playSound('drumroll')">🥁 Drumroll</button>
      <button class="sound-btn" onclick="playSound('boo')">👎 Boo</button>
    </div>
  </div>

  <div id="tickerView" class="view-section">
    <div style="background: #1e293b; padding: 16px; border-radius: 12px;">
      <div style="font-size: 0.85rem; font-weight: 700; color: #f43f5e; margin-bottom: 8px;">UPDATE TV MARQUEE (30s DISPLAY)</div>
      <input type="text" id="tickerInput" placeholder="Type announcement..." style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; margin-bottom: 12px;">
      <button onclick="updateTickerText()" style="width: 100%; padding: 12px; background: #f43f5e; border: none; color: #fff; font-weight: 800; border-radius: 8px; cursor: pointer;">Broadcast Announcement 📢</button>
    </div>
  </div>

  <div class="playback-bar">
    <div>
      <div style="font-size: 0.7rem; color: #94a3b8; font-weight: 700;">NOW PLAYING</div>
      <div id="nowPlayingText" style="font-size: 0.85rem; font-weight: 700; color: #fff; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">No songs in queue</div>
    </div>
    <button class="btn-skip" onclick="skipSong()">Next ⏭️</button>
  </div>

<script>
  const socket = io();
  const urlParams = new URLSearchParams(window.location.search);
  const roomCode = urlParams.get('room') || 'ROOM-1000';

  document.getElementById('roomDisplay').textContent = roomCode;
  socket.emit('joinRoom', roomCode);

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));

    if (tabName === 'search') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('searchView').classList.add('active');
    } else if (tabName === 'queue') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('queueView').classList.add('active');
    } else if (tabName === 'fx') {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('fxView').classList.add('active');
    } else if (tabName === 'ticker') {
      document.querySelectorAll('.tab-btn')[3].classList.add('active');
      document.getElementById('tickerView').classList.add('active');
    }
  }

  function performSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    document.getElementById('searchResults').innerHTML = '<div style="color:#94a3b8; text-align:center; padding:20px;">Searching YouTube...</div>';
    socket.emit('searchSong', query);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') performSearch();
  });

  socket.on('searchResults', (results) => {
    const resultsContainer = document.getElementById('searchResults');
    resultsContainer.innerHTML = '';

    if (results.length === 0) {
      resultsContainer.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:20px;">No results found.</div>';
      return;
    }

    results.forEach(video => {
      const card = document.createElement('div');
      card.className = 'item-card';
      const escapedTitle = video.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      card.innerHTML = `
        <img src="${video.thumbnail}" alt="thumb">
        <div class="item-info">
          <div class="item-title">${video.title}</div>
        </div>
        <button class="btn-add" onclick="addSong('${video.id}', '${escapedTitle}', this)">+ Add</button>
      `;
      resultsContainer.appendChild(card);
    });
  });

  function addSong(videoId, videoTitle, btn) {
    const userName = document.getElementById('userName').value.trim() || 'Guest';
    socket.emit('addSong', { room: roomCode, id: videoId, title: videoTitle, user: userName });

    if (btn) {
      btn.textContent = 'Added ✓';
      btn.classList.add('added');
      btn.disabled = true;

      setTimeout(() => {
        btn.textContent = '+ Add';
        btn.classList.remove('added');
        btn.disabled = false;
      }, 2000);
    }
  }

  socket.on('updateQueue', (queue) => {
    document.getElementById('queueCount').textContent = queue.length;
    const queueList = document.getElementById('queueList');
    queueList.innerHTML = '';

    if (queue.length === 0) {
      document.getElementById('nowPlayingText').textContent = 'No songs in queue';
      queueList.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:20px;">Queue is currently empty.</div>';
      return;
    }

    document.getElementById('nowPlayingText').textContent = queue[0].title;

    queue.forEach((song, index) => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div style="font-weight:800; color:${index === 0 ? '#10b981' : '#f43f5e'}; font-size:0.9rem;">
          ${index === 0 ? '▶' : '#' + (index + 1)}
        </div>
        <div class="item-info">
          <div class="item-title">${song.title}</div>
          <div class="item-sub">Requested by: ${song.user}</div>
        </div>
        ${index > 0 ? `<button class="btn-danger" onclick="removeSong(${index})">✕</button>` : ''}
      `;
      queueList.appendChild(card);
    });
  });

  function updateTickerText() {
    const text = document.getElementById('tickerInput').value.trim();
    if (!text) return;
    socket.emit('updateTicker', { roomCode: roomCode, text: text });
    document.getElementById('tickerInput').value = '';
    alert('Announcement broadcasted to TV for 30 seconds!');
  }

  function skipSong() { socket.emit('nextSong'); }
  function removeSong(index) { socket.emit('removeSong', { room: roomCode, index: index }); }
  function playSound(soundName) { socket.emit('playSound', { room: roomCode, sound: soundName }); }
  function sendReaction(emoji) { socket.emit('sendEmoji', { room: roomCode, emoji: emoji }); }
</script>
</body>
</html>
